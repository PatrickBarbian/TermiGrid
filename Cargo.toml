[package]
name = "termigrid"
version = "1.9.1"
edition = "2024"
description = "TermiGrid - Cross-platform Terminal Block Strip Designer & Labeling Exporter for Control Cabinet Manufacturing"
authors = ["Patrick Barbian"]
license = "MIT"

[lib]
name = "termigrid_core"
crate-type = ["lib", "cdylib"]

[[bin]]
name = "termigrid"
path = "src/main.rs"

[dependencies]
egui = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust_xlsxwriter = "0.102"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
lopdf = "0.47"
regex = "1"

[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = { version = "0.37", default-features = false, features = [
    "accesskit",
    "clipboard",
    "default_fonts",
    "glow",
    "links",
    "system_fonts",
] }
rfd = "0.18"

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.37", default-features = false, features = [
    "android-native-activity",
    "clipboard",
    "default_fonts",
    "glow",
    "system_fonts",
] }
winit = { version = "0.30", default-features = false, features = ["android-native-activity"] }
jni = "0.22"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[package.metadata.android]
package = "com.patrickbarbian.termigrid"
apk_name = "TermiGrid"
build_targets = ["aarch64-linux-android", "armv7-linux-androideabi", "x86_64-linux-android"]
resources = "assets/android/res"

[package.metadata.android.sdk]
min_sdk_version = 24
target_sdk_version = 35

[package.metadata.android.application]
label = "TermiGrid"
icon = "@mipmap/ic_launcher"
resizeable_activity = true

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[package.metadata.android.application.activity]
config_changes = "orientation|screenSize|screenLayout|smallestScreenSize|density|keyboard|keyboardHidden|navigation|uiMode"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
