name: Release TermiGrid (Windows, macOS Universal, Android)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: false
        default: "v1.0.0"
      windows_only:
        description: "Build only Windows (.exe) release"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  test:
    name: Check, Clippy & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux GUI build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libgtk-3-dev
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  prepare-release:
    name: Prepare GitHub Release
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Ensure GitHub Release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            TAG="${{ github.event.inputs.tag || 'v1.0.0' }}"
          fi
          gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1 || \
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "TermiGrid $TAG" \
            --notes "Cross-platform Release für Windows (.exe), macOS Universal Intel + Apple Silicon (.dmg) und Android Smartphones/Foldables/Tablets (.apk)."

  build-windows:
    name: Build Windows (x86_64 .exe)
    needs: prepare-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release exe
        run: cargo build --release --bin termigrid
      - name: Stage artifact
        shell: pwsh
        run: Copy-Item target\release\termigrid.exe TermiGrid-windows-x86_64.exe
      - name: Upload Windows asset immediately to Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          if ("${{ github.ref_type }}" -ne "tag") { $tag = "${{ github.event.inputs.tag }}" }
          gh release upload "$tag" TermiGrid-windows-x86_64.exe --repo "${{ github.repository }}" --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: TermiGrid-windows
          path: TermiGrid-windows-x86_64.exe

  build-macos:
    name: Build macOS Universal (Intel + Apple Silicon)
    needs: prepare-release
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.windows_only }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build Intel x86_64 binary
        run: cargo build --release --bin termigrid --target x86_64-apple-darwin
      - name: Build Apple Silicon arm64 binary
        run: cargo build --release --bin termigrid --target aarch64-apple-darwin
      - name: Package Universal .app & .dmg
        run: |
          mkdir -p TermiGrid.app/Contents/MacOS TermiGrid.app/Contents/Resources
          lipo -create \
            target/x86_64-apple-darwin/release/termigrid \
            target/aarch64-apple-darwin/release/termigrid \
            -output TermiGrid.app/Contents/MacOS/TermiGrid
          chmod +x TermiGrid.app/Contents/MacOS/TermiGrid

          mkdir -p TermiGrid.iconset
          sips -z 16 16     assets/icon.png --out TermiGrid.iconset/icon_16x16.png
          sips -z 32 32     assets/icon.png --out TermiGrid.iconset/icon_16x16@2x.png
          sips -z 32 32     assets/icon.png --out TermiGrid.iconset/icon_32x32.png
          sips -z 64 64     assets/icon.png --out TermiGrid.iconset/icon_32x32@2x.png
          sips -z 128 128   assets/icon.png --out TermiGrid.iconset/icon_128x128.png
          sips -z 256 256   assets/icon.png --out TermiGrid.iconset/icon_128x128@2x.png
          sips -z 256 256   assets/icon.png --out TermiGrid.iconset/icon_256x256.png
          sips -z 512 512   assets/icon.png --out TermiGrid.iconset/icon_256x256@2x.png
          sips -z 512 512   assets/icon.png --out TermiGrid.iconset/icon_512x512.png
          iconutil -c icns TermiGrid.iconset -o TermiGrid.app/Contents/Resources/TermiGrid.icns

          cat > TermiGrid.app/Contents/Info.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>TermiGrid</string>
            <key>CFBundleDisplayName</key>
            <string>TermiGrid</string>
            <key>CFBundleIdentifier</key>
            <string>com.patrickbarbian.termigrid</string>
            <key>CFBundleVersion</key>
            <string>${GITHUB_REF_NAME#v}</string>
            <key>CFBundleShortVersionString</key>
            <string>${GITHUB_REF_NAME#v}</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleExecutable</key>
            <string>TermiGrid</string>
            <key>CFBundleIconFile</key>
            <string>TermiGrid</string>
            <key>NSHighResolutionCapable</key>
            <true/>
            <key>LSMinimumSystemVersion</key>
            <string>11.0</string>
          </dict>
          </plist>
          EOF

          hdiutil create -volname "TermiGrid" -srcfolder TermiGrid.app -ov -format UDZO TermiGrid-macos-universal.dmg
      - name: Upload macOS asset immediately to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            TAG="${{ github.event.inputs.tag || 'v1.0.0' }}"
          fi
          gh release upload "$TAG" TermiGrid-macos-universal.dmg --repo "${{ github.repository }}" --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: TermiGrid-macos
          path: TermiGrid-macos-universal.dmg

  build-android:
    name: Build Android (Phones, Foldables & Tablets .apk)
    needs: prepare-release
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.windows_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Setup Android SDK & NDK
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Install cargo-apk
        run: cargo install cargo-apk --locked
      - name: Build universal multi-ABI APK (16KB page-aligned + v2/v3 signed)
        run: |
          keytool -genkeypair -v \
            -keystore android-release.keystore \
            -alias termigrid \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass termigrid_release -keypass termigrid_release \
            -dname "CN=TermiGrid, O=PatrickBarbian, C=DE"

          cat >> Cargo.toml <<'EOF'

          [package.metadata.android.signing.release]
          path = "android-release.keystore"
          keystore_password = "termigrid_release"
          EOF

          RUSTFLAGS="-C link-arg=-Wl,-z,max-page-size=16384" cargo apk build --release --lib
          RAW_APK=$(find target -name "*.apk" | head -n 1)
          echo "Raw APK: $RAW_APK"

          BT="${ANDROID_HOME}/build-tools/35.0.0"
          "${BT}/zipalign" -P 16 -f -v 4 "$RAW_APK" TermiGrid-aligned.apk
          "${BT}/apksigner" sign \
            --ks android-release.keystore \
            --ks-pass pass:termigrid_release \
            --key-pass pass:termigrid_release \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out TermiGrid-android-universal.apk \
            TermiGrid-aligned.apk
          "${BT}/apksigner" verify --verbose TermiGrid-android-universal.apk
      - name: Upload Android asset immediately to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            TAG="${{ github.event.inputs.tag || 'v1.0.0' }}"
          fi
          gh release upload "$TAG" TermiGrid-android-universal.apk --repo "${{ github.repository }}" --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: TermiGrid-android
          path: TermiGrid-android-universal.apk
